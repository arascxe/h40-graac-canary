name: MDRTF Future-Only Runtime

on:
  push:
    branches: [main]
    paths:
      - "mdrtf/**"
      - ".github/workflows/mdrtf-future-only.yml"
  schedule:
    # GitHub scheduled starts can be delayed. Each job therefore carries almost
    # the complete six-hour window instead of collecting for only 57 minutes.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mdrtf-future-only-runtime
  # A code deployment supersedes an older binary; scheduled runs never cancel
  # an active collection window.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Restore latest future-only state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime
          previous_run="$(gh run list --workflow mdrtf-future-only.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$previous_run" ]; then
            gh run download "$previous_run" -n mdrtf-state -D runtime || true
          fi

      - name: Verify shadow research contracts
        working-directory: mdrtf
        run: |
          python3 -m pip install --disable-pip-version-check --quiet 'nats-py==2.11.0'
          python3 -m unittest -v test_family_optionality_shadow.py
          python3 -m unittest -v test_public_skill_consensus.py
          python3 -m unittest -v test_pump_future_census.py
          python3 -m unittest -v test_pump_realtime_stream.py
          python3 -m unittest -v test_attention_issuance_shadow.py
          python3 -m py_compile mdrtf_collector.py family_optionality_shadow.py public_skill_consensus.py pump_future_census.py pump_realtime_stream.py attention_issuance_shadow.py

      - name: Collect 208 prospective cuts
        run: |
          python3 mdrtf/mdrtf_collector.py \
            --db runtime/mdrtf_future_ledger.sqlite3 \
            --loop --interval 90 --max-cuts 208 \
            | tee runtime/mdrtf_run.jsonl

      - name: Freeze runtime health
        if: always()
        run: |
          python3 - <<'PY'
          import datetime as dt, json, sqlite3
          from pathlib import Path
          path = Path("runtime/mdrtf_future_ledger.sqlite3")
          health = {"checked_at": dt.datetime.now(dt.timezone.utc).isoformat(), "db_exists": path.exists()}
          if path.exists():
              conn = sqlite3.connect(path)
              health["integrity"] = conn.execute("pragma integrity_check").fetchone()[0]
              health["cuts"] = conn.execute("select count(*) from cuts").fetchone()[0]
              health["latest_cut"] = conn.execute("select max(created_at) from cuts").fetchone()[0]
              health["frozen_families"] = conn.execute("select count(*) from family_freezes").fetchone()[0]
              health["route_simulations"] = conn.execute("select count(*) from route_simulations").fetchone()[0]
              tables = {row[0] for row in conn.execute("select name from sqlite_master where type='table'")}
              health["fos_baskets"] = conn.execute("select count(*) from fos_baskets").fetchone()[0] if "fos_baskets" in tables else 0
              health["fos_rotations"] = conn.execute("select count(*) from fos_rotations").fetchone()[0] if "fos_rotations" in tables else 0
              health["fos_capital_state_violations"] = conn.execute(
                  "select count(*) from fos_baskets where capital_state <> 'CAPITAL_LOCKED'"
              ).fetchone()[0] if "fos_baskets" in tables else 0
              health["ppsc_raw_trades"] = conn.execute("select count(*) from ppsc_raw_trades").fetchone()[0] if "ppsc_raw_trades" in tables else 0
              health["ppsc_qualified_wallets"] = conn.execute("select count(*) from ppsc_wallet_qualifications").fetchone()[0] if "ppsc_wallet_qualifications" in tables else 0
              health["ppsc_paper_candidates"] = conn.execute(
                  "select count(*) from ppsc_consensus_signals where signal_state='PAPER_PROBE_CANDIDATE'"
              ).fetchone()[0] if "ppsc_consensus_signals" in tables else 0
              health["ppsc_capital_state_violations"] = sum([
                  conn.execute("select count(*) from ppsc_runtime where capital_state <> 'CAPITAL_LOCKED'").fetchone()[0] if "ppsc_runtime" in tables else 0,
                  conn.execute("select count(*) from ppsc_wallet_qualifications where capital_state <> 'CAPITAL_LOCKED'").fetchone()[0] if "ppsc_wallet_qualifications" in tables else 0,
                  conn.execute("select count(*) from ppsc_consensus_signals where capital_state <> 'CAPITAL_LOCKED'").fetchone()[0] if "ppsc_consensus_signals" in tables else 0,
              ])
              health["pump_future_launches"] = conn.execute("select count(*) from pump_launches").fetchone()[0] if "pump_launches" in tables else 0
              health["pump_future_trades"] = conn.execute("select count(*) from pump_raw_trades").fetchone()[0] if "pump_raw_trades" in tables else 0
              health["pump_complete_launch_intervals"] = conn.execute(
                  "select count(*) from pump_census_cuts where source_state='COMPLETE_INTERVAL'"
              ).fetchone()[0] if "pump_census_cuts" in tables else 0
              health["pump_launch_gaps"] = conn.execute(
                  "select count(*) from pump_census_cuts where source_state='GAP'"
              ).fetchone()[0] if "pump_census_cuts" in tables else 0
              health["pump_complete_trade_refreshes"] = conn.execute(
                  "select count(*) from pump_trade_fetches where coverage_state='COMPLETE_INTERVAL'"
              ).fetchone()[0] if "pump_trade_fetches" in tables else 0
              health["pump_trade_gaps"] = conn.execute(
                  "select count(*) from pump_trade_fetches where coverage_state not in ('COMPLETE_INTERVAL')"
              ).fetchone()[0] if "pump_trade_fetches" in tables else 0
              health["pump_capital_state_violations"] = conn.execute(
                  "select count(*) from pump_census_runtime where capital_state <> 'CAPITAL_LOCKED'"
              ).fetchone()[0] if "pump_census_runtime" in tables else 0
              health["pump_stream_events"] = conn.execute("select count(*) from pump_stream_events").fetchone()[0] if "pump_stream_events" in tables else 0
              health["pump_stream_active_cuts"] = conn.execute(
                  "select count(*) from pump_stream_cuts where coverage_state='RAW_CAPTURE_ACTIVE'"
              ).fetchone()[0] if "pump_stream_cuts" in tables else 0
              health["pump_stream_buffer_gaps"] = conn.execute(
                  "select count(*) from pump_stream_cuts where coverage_state='BUFFER_GAP'"
              ).fetchone()[0] if "pump_stream_cuts" in tables else 0
              health["issuance_due_diligence_candidates"] = conn.execute(
                  "select count(distinct event_id) from issuance_candidate_observations "
                  "where candidate_state='LAUNCH_DUE_DILIGENCE_CANDIDATE'"
              ).fetchone()[0] if "issuance_candidate_observations" in tables else 0
              health["issuance_due_diligence_observations"] = conn.execute(
                  "select count(*) from issuance_candidate_observations "
                  "where candidate_state='LAUNCH_DUE_DILIGENCE_CANDIDATE'"
              ).fetchone()[0] if "issuance_candidate_observations" in tables else 0
              health["issuance_actionable_launches"] = 0
              health["issuance_capital_state_violations"] = sum([
                  conn.execute("select count(*) from issuance_shadow_runtime where capital_state <> 'CAPITAL_LOCKED'").fetchone()[0]
                  if "issuance_shadow_runtime" in tables else 0,
                  conn.execute("select count(*) from issuance_attention_births where capital_state <> 'CAPITAL_LOCKED'").fetchone()[0]
                  if "issuance_attention_births" in tables else 0,
                  conn.execute("select count(*) from issuance_candidate_observations where capital_state <> 'CAPITAL_LOCKED'").fetchone()[0]
                  if "issuance_candidate_observations" in tables else 0,
              ])
              conn.close()
          run_path = Path("runtime/mdrtf_run.jsonl")
          rows = []
          if run_path.exists():
              for line in run_path.read_text(encoding="utf-8").splitlines():
                  try:
                      rows.append(json.loads(line))
                  except json.JSONDecodeError:
                      pass
          cut_times = []
          for row in rows:
              raw = row.get("cut_id")
              if raw and row.get("decision") != "SKIP_RATE_GUARD":
                  try:
                      cut_times.append(dt.datetime.fromisoformat(raw.replace("Z", "+00:00")))
                  except ValueError:
                      pass
          gaps = [(b-a).total_seconds() for a, b in zip(cut_times, cut_times[1:])]
          health["run_rows"] = len(rows)
          health["scheduled_cuts"] = len(cut_times)
          health["max_cut_gap_seconds"] = max(gaps, default=None)
          health["on_time_cut_starts"] = (1 if cut_times else 0) + sum(
              abs(gap - 90) <= 30 for gap in gaps
          )
          health["attention_quorum_cuts"] = sum(
              r.get("attention_sources_ok", 0) >= max(2, r.get("attention_sources_total", 5) - 1)
              for r in rows if r.get("decision") != "SKIP_RATE_GUARD"
          )
          health["solana_coverage_cuts"] = sum(
              bool((r.get("lane_coverage") or {}).get("solana"))
              for r in rows if r.get("decision") != "SKIP_RATE_GUARD"
          )
          required_coverage_cuts = int(len(cut_times) * 0.95 + 0.999999)
          health["required_95pct_coverage_cuts"] = required_coverage_cuts
          pump_states = [
              (r.get("pump_future_census") or {}).get("coverage_state")
              for r in rows if r.get("decision") != "SKIP_RATE_GUARD"
          ]
          health["pump_launch_complete_cuts"] = sum(state == "COMPLETE_INTERVAL" for state in pump_states)
          health["pump_launch_gap_cuts"] = sum(state in {"GAP", "SOURCE_ERROR"} for state in pump_states)
          health["pump_launch_window_pass"] = bool(
              pump_states
              and pump_states[0] == "BASELINE_ONLY"
              and all(state == "COMPLETE_INTERVAL" for state in pump_states[1:])
          )
          health["decisions"] = {k: sum(r.get("decision") == k for r in rows) for k in sorted({r.get("decision") for r in rows}) if k}
          health["operational_window_pass"] = bool(
              health.get("integrity") == "ok"
              and len(cut_times) >= 208
              and (not gaps or max(gaps) <= 300)
              and health.get("on_time_cut_starts", 0) >= required_coverage_cuts
              and health.get("attention_quorum_cuts", 0) >= required_coverage_cuts
              and health.get("solana_coverage_cuts", 0) >= required_coverage_cuts
              and health.get("fos_capital_state_violations", 0) == 0
              and health.get("ppsc_capital_state_violations", 0) == 0
              and health.get("pump_capital_state_violations", 0) == 0
              and health.get("issuance_capital_state_violations", 0) == 0
          )
          Path("runtime/mdrtf_health.json").write_text(json.dumps(health, indent=2), encoding="utf-8")
          if health.get("integrity") not in (None, "ok"):
              raise SystemExit("SQLite integrity failure")
          if not health.get("operational_window_pass"):
              raise SystemExit("Operational cadence failure")
          PY

      - name: Persist rolling seven-day state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mdrtf-state
          path: |
            runtime/mdrtf_future_ledger.sqlite3
            runtime/mdrtf_run.jsonl
            runtime/mdrtf_health.json
          retention-days: 7
          compression-level: 9
          if-no-files-found: error
