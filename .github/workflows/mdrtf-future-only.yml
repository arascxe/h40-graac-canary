name: MDRTF Future-Only Runtime — STOPPED

on:
  push:
    paths:
      - ".github/workflows/mdrtf-future-only.yml"
  workflow_dispatch:

concurrency:
  group: mdrtf-future-only-runtime
  cancel-in-progress: true

jobs:
  stopped:
    runs-on: ubuntu-latest
    steps:
      - run: echo "DATA_COLLECTION_STOPPED"
