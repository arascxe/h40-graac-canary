name: TikTok CC browser probe

on:
  workflow_dispatch:
  push:
    paths:
      - "premint_discovery/tiktok_cc_browser_probe.mjs"
      - ".github/workflows/tiktok-cc-browser-probe.yml"

permissions:
  contents: read

concurrency:
  group: tiktok-cc-browser-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium

      - name: Run browser-assisted TikTok probe
        run: node premint_discovery/tiktok_cc_browser_probe.mjs
