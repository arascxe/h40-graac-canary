name: FEE100K matched launch shadow

on:
  push:
    paths:
      - .github/workflows/fee100k-matched-launch-shadow.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Freeze a bounded first-party launch cohort
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import subprocess
          import time
          import urllib.parse
          from pathlib import Path

          started = dt.datetime.now(dt.timezone.utc)
          pages = []
          for page in range(3):
              url = 'https://frontend-api-v3.pump.fun/coins?' + urllib.parse.urlencode({
                  'offset': page * 70, 'limit': 70, 'sort': 'created_timestamp',
                  'order': 'DESC', 'includeNsfw': 'true'})
              process = subprocess.run(['curl','-sS','--max-time','15','-A','FEE100K-readonly-cohort/1.0',
                                        '-w','\n__STATUS__%{http_code}',url],
                                       capture_output=True,timeout=20)
              body, sep, status = process.stdout.rpartition(b'\n__STATUS__')
              if not sep or status.strip() != b'200':
                  raise SystemExit(f'page {page} source error: {status[:30]!r}')
              data = json.loads(body)
              if not isinstance(data,list) or not data:
                  raise SystemExit(f'page {page} empty or invalid')
              pages.append(data)
              time.sleep(1)

          launches = {}
          for page in pages:
              for item in page:
                  if item.get('program') != 'pump' or not item.get('mint') or not item.get('created_timestamp'):
                      continue
                  launches[item['mint']] = {
                      'mint':item['mint'],'created_timestamp_ms':item['created_timestamp'],
                      'creator':item.get('creator'),'name':item.get('name'),
                      'symbol':item.get('symbol'),'complete_at_freeze':item.get('complete'),
                  }
          if len(launches) < 100:
              raise SystemExit(f'incomplete baseline: {len(launches)} unique Pump launches')
          rows = sorted(launches.values(),key=lambda r:(r['created_timestamp_ms'],r['mint']))
          result = {
              'freeze_utc':started.isoformat(),'source':'Pump first-party recent coins, 3x70',
              'coverage':'BASELINE_ONLY; pagination overlap with prior snapshot unverified',
              'page_counts':[len(p) for p in pages],'unique_pump_launches':len(rows),
              'oldest_created_ms':rows[0]['created_timestamp_ms'],
              'newest_created_ms':rows[-1]['created_timestamp_ms'],
              'selection':'ALL returned launches frozen before subsequent outcomes; missing future pair or trade is UNKNOWN',
              'launches':rows,
          }
          Path('matched-launch-shadow.json').write_text(json.dumps(result,ensure_ascii=False,separators=(',',':')))
          print(json.dumps({k:v for k,v in result.items() if k!='launches'}))
          PY

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: matched-launch-shadow
          path: matched-launch-shadow.json
          retention-days: 7
